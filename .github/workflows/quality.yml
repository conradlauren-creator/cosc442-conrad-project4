name: Quality Checks

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  coffeemaker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CoffeeMaker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run JUnit regression tests
        run: ./mvnw test

      - name: Run PIT mutation testing
        run: ./mvnw pitest:mutationCoverage

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coffeemaker-pit-report
          path: CoffeeMaker/target/pit-reports

  joshhack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JoshHack
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run JUnit regression tests
        run: ./mvnw test

      - name: Run PIT mutation testing
        run: ./mvnw pitest:mutationCoverage

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joshhack-pit-report
          path: JoshHack/target/pit-reports